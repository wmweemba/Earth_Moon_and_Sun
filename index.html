<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sun, Earth, and Moon Simulation</title>
        <link rel="stylesheet" href="style.css"> <!-- Link to the CSS file -->
    </head>
    <body>
        <!-- Container for the solar system -->
        <div class="container">
            <!-- The Sun -->
            <div class="sun"></div>

            <!-- Earth's orbit -->
            <div class="orbit earth">
                <!-- The Earth -->
                <div class="globe earth">
                    <!-- Moon's orbit -->
                    <div class="orbit moon">
                        <!-- The Moon -->
                        <div class="globe moon"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
